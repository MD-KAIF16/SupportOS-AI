name: SupportOS AI Backend CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run Backend Tests
        env:
          SECRET_KEY: "ci_test_secret_key"
          GEMINI_API_KEY: "ci_gemini_api_key"
          SUPABASE_URL: "https://example.supabase.co"
          # SUPABASE_PUBLISHABLE_KEY is required because supabase_auth client is initialized during application import
          SUPABASE_PUBLISHABLE_KEY: "ci_publishable_key"
          SUPABASE_SERVICE_ROLE_KEY: "ci_service_role_key"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "ci_qdrant_api_key"
        run: |
          cd backend
          pytest -v --ignore=.venv

